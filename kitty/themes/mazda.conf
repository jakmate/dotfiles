# PeaceMaker Kitty Terminal Theme
# Cinematic red palette optimized for deep work and visual comfort

# Font settings - enhanced readability
font_family      JetBrains Mono
font_size        12.5
font_fallback_strategy goto-next
additional_font_families Noto Sans CJK JP,Noto Serif CJK JP
bold_font          auto
italic_font        auto
bold_italic_font   auto
adjust_line_height 1

# Window settings - cinematic framing
background_opacity 0.96
dynamic_background_opacity yes
window_padding_width 12
hide_window_decorations titlebar-only
confirm_os_window_close 0
window_border_width 1.5
window_border_color #C82626

# Flow state color scheme - deep red foundation
foreground #D2C7C7
background #471D1D
selection_foreground #471D1D
selection_background #C82626

# Cursor - vibrant red focus point
cursor #C82626
cursor_text_color #471D1D
cursor_shape block
cursor_blink_interval 0
cursor_underline_thickness 2.0

# URL colors - warm highlights
url_color #D2C7C7
url_style double
url_hover_fg #FFFFFF
url_hover_bg #C82626

# Normal colors - monochromatic red spectrum
color0  #471D1D
color1  #C82626
color2  #D2C7C7
color3  #D2C7C7
color4  #7E1717
color5  #A03030
color6  #D2C7C7
color7  #D2C7C7

# Bright colors - enhanced contrast
color8  #7E1717
color9  #FF6B5A
color10 #D2C7C7
color11 #D2C7C7
color12 #C82626
color13 #FF8E7D
color14 #D2C7C7
color15 #FFFFFF

# Tab bar - cinematic navigation
tab_bar_edge top
tab_bar_style separator
tab_separator "  |  "
tab_bar_background #471D1D
active_tab_foreground #D2C7C7
active_tab_background #7E1717
active_tab_font_style bold
inactive_tab_foreground #B5A5A5
inactive_tab_background #471D1D
inactive_tab_font_style normal
tab_bar_margin_width 4
tab_title_template "{title}  "

# Visual enhancements
enable_audio_bell no
visual_bell_duration 0.2
visual_bell_color #C82626

# Scrollback - extended history
scrollback_lines 20000
scrollback_pager_history_size 10000
scrollback_fill_enlarged_window yes

# Performance tuning
repaint_delay 6
input_delay 1
sync_to_monitor yes
close_on_child_death yes

# Mouse behavior - refined interaction
mouse_hide_wait 1.5
strip_trailing_spaces smart
copy_on_select yes
url_color #D2C7C7
open_url_with kitty +open-url

# Keyboard shortcuts - optimized workflow
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+equal increase_font_size
map ctrl+shift+minus decrease_font_size
map ctrl+shift+backspace restore_font_size
map ctrl+shift+f show_scrollback
map ctrl+shift+t new_tab
map ctrl+shift+w close_tab
map ctrl+shift+q close_window
map ctrl+shift+s split_horizontal
map ctrl+shift+d split_vertical
map ctrl+tab next_tab
map ctrl+shift+tab previous_tab

# Special effects
background_image_layout scaled
background_image_linear false
dynamic_title yes
