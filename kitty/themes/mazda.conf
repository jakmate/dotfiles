# =========================
# JDM DASHBOARD – KITTY
# Matches Waybar & Wofi
# =========================

# -------- Font --------
font_family      JetBrains Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.5

# Slightly tighter like a gauge display
adjust_line_height  0
adjust_column_width 0

# -------- Window --------
background            #201D1F
foreground            #D7D7DA
selection_background  #7D7F82
selection_foreground  #201D1F

# Subtle border like an instrument bezel
window_border_width 1
active_border_color   #F01416
inactive_border_color #7D7F82

# Slight padding – cockpit feel
window_padding_width 8

# -------- Cursor --------
cursor               #F01416
cursor_text_color    #201D1F
cursor_shape         block
cursor_blink_interval 0.7

# -------- Scrollback --------
scrollback_lines 5000

# -------- URL Style --------
url_color #796563

# -------- Tabs (minimal, dash-style) --------
tab_bar_style separator
tab_separator " "
active_tab_foreground   #F01416
active_tab_background   #201D1F
inactive_tab_foreground #7D7F82
inactive_tab_background #201D1F

# -------- Colors --------
# Normal
color0  #201D1F
color1  #F01416
color2  #7D7F82
color3  #796563
color4  #7D7F82
color5  #796563
color6  #D7D7DA
color7  #D7D7DA

# Bright
color8  #2A2628
color9  #F01416
color10 #7D7F82
color11 #796563
color12 #7D7F82
color13 #796563
color14 #D7D7DA
color15 #FFFFFF

# -------- Bell --------
enable_audio_bell no
visual_bell_duration 0.1
visual_bell_color #F01416

# -------- Performance --------
repaint_delay 10
input_delay 3
sync_to_monitor yes

