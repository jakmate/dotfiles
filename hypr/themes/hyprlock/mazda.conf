general {
    disable_loading_bar = true
    grace = 3
    hide_cursor = true
    no_fade_in = false
}

background {
    monitor =
    path = ~/Pictures/mazda.jpg

    # Dashboard fallback (dark interior)
    color = rgb(32, 29, 31)  # #201D1F

    # Subtle glass over gauges
    blur_passes = 1
    blur_size = 3
    contrast = 0.95
    brightness = 0.85
    noise = 0.004
    vibrancy = 0.12
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 380, 55
    position = 0, -120

    dots_center = true
    dots_spacing = 0.35
    dots_radius = 3

    # JDM dashboard logic
    font_color = rgb(215, 215, 218)     # #D7D7DA (text)
    inner_color = rgb(32, 29, 31)       # #201D1F (dash plastic)
    outer_color = rgb(125, 127, 130)    # #7D7F82 (metal bezel)
    outline_color = rgb(240, 20, 22)    # #F01416 (redline focus)

    placeholder_text = <span foreground='##7D7F82'>Enter Passphrase...</span>

    hide_input = false
    fade_on_empty = false

    # Feedback = redline only
    check_color = rgb(240, 20, 22)
    fail_color  = rgb(240, 20, 22)
    fail_text   = <i>$FAIL <b>($ATTEMPTS)</b></i>

    capslock_color = -1
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = false
}

# =========================
# TIME – MAIN GAUGE
# =========================
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgb(215, 215, 218)   # #D7D7DA
    font_size = 95
    font_family = JetBrains Mono Bold
    position = 0, 200
    halign = center
    valign = center
}

# =========================
# DATE – SECONDARY DIAL
# =========================
label {
    monitor =
    text = cmd[update:180000] echo "$(date +'%A, %d %B')"
    color = rgb(125, 127, 130)   # #7D7F82
    font_size = 26
    font_family = JetBrains Mono
    position = 0, 300
    halign = center
    valign = center
}

# =========================
# UPTIME – STATUS TEXT
# =========================
label {
    monitor =
    text = cmd[update:5000] echo "$(uptime -p | sed 's/up //')"
    color = rgba(125, 127, 130, 0.6)
    font_size = 12
    font_family = JetBrains Mono
    position = 0, -300
    halign = center
    valign = center
}

