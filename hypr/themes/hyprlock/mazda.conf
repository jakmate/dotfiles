general {
    disable_loading_bar = true
    grace = 3
    hide_cursor = true
    no_fade_in = false
}

background {
    monitor = 
    path = ~/Pictures/mazda.jpg
    color = rgba(71, 29, 29, 1.0)  # Deep red fallback (471D1D)
    
    # Minimal blur for focus - enhanced for cinematic effect
    blur_passes = 1
    blur_size = 3
    contrast = 0.95
    brightness = 0.85
    noise = 0.005
    vibrancy = 0.15
    vibrancy_darkness = 0.0
}

input-field {
    monitor = 
    size = 380, 55
    position = 0, -120
    dots_center = true
    dots_spacing = 0.35
    dots_radius = 3
    
    # Flow state colors - warm red for interaction, deep red for calm
    font_color = rgb(255, 107, 90)      # Warm coral (from original, kept for consistency)
    inner_color = rgb(71, 29, 29)       # Deep red background (471D1D)
    outer_color = rgb(196, 38, 38)      # Vibrant red border (C82626)
    outline_color = rgb(255, 142, 125)  # Warm coral outline (focus)
    
    placeholder_text = <span foreground='##B5A5A5'>Enter Passphrase...</span>
    hide_input = false
    fade_on_empty = false
    check_color = rgb(196, 38, 38)      # Red for success (positive reinforcement)
    fail_color = rgb(196, 38, 38)       # Muted red for errors
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = -1
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = false
}

# Time display - warm red accent
label {
    monitor = 
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgb(255, 142, 125)    # Warm coral
    font_size = 95
    font_family = JetBrains Mono Bold
    position = 0, 200
    halign = center
    valign = center
}

# Date display - soft red for secondary info
label {
    monitor = 
    text = cmd[update:180000] echo "$(date +'%A, %d %B')"
    color = rgb(196, 38, 38)      # Vibrant red (C82626)
    font_size = 26
    font_family = JetBrains Mono
    position = 0, 300
    halign = center
    valign = center
}

# Subtle system info - minimal distraction
label {
    monitor = 
    text = cmd[update:5000] echo "$(uptime -p | sed 's/up //')"
    color = rgba(181, 165, 165, 0.6)  # Muted red (B5A5A5)
    font_size = 12
    font_family = JetBrains Mono
    position = 0, -300
    halign = center
    valign = center
}
